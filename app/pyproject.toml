[project]
name = "demo-api"
version = "0.1.0"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S311"]  # random is fine for simulated latency/errors

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/demo_api/main.py" = ["S104"]
