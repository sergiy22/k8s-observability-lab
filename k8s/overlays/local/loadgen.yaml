apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: curlimages/curl:8.23.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Sending traffic to http://demo-api/api/orders"
              while true; do
                curl -s -o /dev/null --max-time 5 http://demo-api/api/orders
                sleep 0.1
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
