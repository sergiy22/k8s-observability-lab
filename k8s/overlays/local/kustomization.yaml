apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local overlay: image built on the host and loaded into kind (`make image load`),
# plus a load generator so dashboards and alerts have traffic to show.
resources:
  - ../../base
  - loadgen.yaml

images:
  - name: demo-api
    newName: demo-api
    newTag: local
