apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

labels:
  - pairs:
      app.kubernetes.io/part-of: k8s-observability-lab
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - availability.yaml
  - networkpolicy.yaml
  - monitoring.yaml

# Grafana's dashboard sidecar watches for ConfigMaps with this label.
configMapGenerator:
  - name: demo-api-dashboard
    files:
      - dashboards/demo-api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
